# Mac1 DNS server IP on this Wi-Fi network.
listen-address=127.0.0.1,10.7.21.200
bind-interfaces

# dnsmasq answers these locally and does not forward *.admv.test to the internet.
local=/admv.test/
host-record=app.admv.test,10.7.23.71
host-record=api.admv.test,10.7.23.71
local-ttl=30

# ---------- Forward everything else ----------
no-resolv
server=8.8.8.8
server=1.1.1.1
domain-needed
bogus-priv

# ---------- Logs for evidence ----------
log-queries
log-facility=/tmp/dnsmasq.log
vaibhav@protocol etc %