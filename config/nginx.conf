# ---------- The backend pool ----------
upstream admv_backends {
    server 10.7.18.160:3001 max_fails=1 fail_timeout=10s;
    server 10.7.2.129:3002 max_fails=1 fail_timeout=10s;
}

# ---------- Port 80: redirect plain HTTP to HTTPS ----------
server {
    listen 80;
    server_name app.admv.test api.admv.test;
    return 301 https://$host$request_uri;
}

# ---------- Port 443: TLS termination + reverse proxy ----------
server {
    listen 443 ssl;
    http2 on;
    server_name app.admv.test api.admv.test;

    ssl_certificate /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://admv_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;

        add_header X-Edge "mac2" always;
        add_header X-Upstream $upstream_addr always;
    }
}
